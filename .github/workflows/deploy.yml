name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check 8px spacing
        run: npm run check:spacing

      - name: Test data and chart geometry
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Check types
        run: npx tsc --noEmit

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_DASHBOARD_URL: ${{ vars.NEXT_PUBLIC_DASHBOARD_URL }}
          NEXT_PUBLIC_INFRA_STATUS_URL: ${{ vars.NEXT_PUBLIC_INFRA_STATUS_URL }}
          NEXT_PUBLIC_OPERATIONS_API_URL: ${{ vars.NEXT_PUBLIC_OPERATIONS_API_URL }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
